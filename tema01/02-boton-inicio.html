<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo 1 · Botón sin transición</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; font-family: system-ui, sans-serif; }
  .btn {
    padding: 18px 44px; border: 0; border-radius: 999px;
    font-size: 22px; font-weight: 600; color: #fff; cursor: pointer;
    background: #3b82f6;
    transition: background 0.3s ease;
  }
  .btn:hover { background: #1e40af; }
</style>
</head>
<body>
  <button class="btn">Enviar</button>
</body>
</html>
