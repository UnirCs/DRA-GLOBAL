<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D8 · El tiempo es parte del mensaje</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    gap: 40px;
    align-items: center;
    justify-content: center;
    background: #0b0b0f;
    color: #f5f2ed;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  button {
    padding: 14px 24px;
    border: 0;
    border-radius: 999px;
    background-color: #1e98cc;
    color: #0b0b0f;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Rápida · 150 ms: un hover tiene que sentirse inmediato */
  .boton {
    transition: background-color 150ms;
  }

  .boton:hover {
    background-color: #f2f0e8;
  }

  /* Media · 250 ms: un cambio de vista, que se vea sin perder el ritmo */
  .vista {
    position: fixed;
    inset: 0;
    background: #17171d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    transform: translateX(100%);
    transition: transform 250ms;
  }

  .vista.abierta {
    transform: translateX(0);
  }

  .vista button {
    position: absolute;
    top: 24px;
    right: 24px;
  }

  /* Lenta · 600 ms: un aviso que queremos que se note */
  .aviso {
    position: fixed;
    left: 50%;
    bottom: 40px;
    margin-left: -160px;
    width: 320px;
    padding: 18px 24px;
    border-radius: 14px;
    background: #ff5c6e;
    color: #0b0b0f;
    text-align: center;
    opacity: 0;
    transition: opacity 600ms;
  }

  .aviso.visible {
    opacity: 1;
  }
</style>
</head>
<body>
  <button class="boton">Pasa por encima</button>
  <button id="abrirVista">Cambiar de vista</button>
  <button id="mostrarAviso">Mostrar aviso</button>

  <div class="vista" id="vista">
    Otra vista
    <button id="cerrarVista">Volver</button>
  </div>

  <div class="aviso" id="aviso">Tu reserva está confirmada</div>

<script>
  const vista = document.querySelector('#vista');
  const aviso = document.querySelector('#aviso');

  document.querySelector('#abrirVista').addEventListener('click', function () {
    vista.classList.add('abierta');
  });

  document.querySelector('#cerrarVista').addEventListener('click', function () {
    vista.classList.remove('abierta');
  });

  document.querySelector('#mostrarAviso').addEventListener('click', function () {
    aviso.classList.toggle('visible');
  });
</script>
</body>
</html>
